name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  check:
    name: Check API and web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.18-bookworm
        env:
          POSTGRES_USER: typesafe
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: typesafe_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U typesafe -d typesafe_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.2-bookworm
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://typesafe:test-only-password@127.0.0.1:5432/typesafe_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.6.8
      - run: uv sync --project apps/api --frozen
      - run: uv sync --project tools/seo --frozen
      - run: uv run --project apps/api ruff check apps/api deploy
      - run: uv run --project apps/api ruff format --check apps/api deploy
      - run: uv run --project apps/api pytest apps/api/tests
      - run: uv run --project tools/seo ruff check tools/seo
      - run: uv run --project tools/seo ruff format --check tools/seo
      - run: uv run --project tools/seo pytest tools/seo/tests
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspace @typesafe-pro/web
      - run: npm run build:web
      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/*.sh
          RELEASE_ID=check RELEASE_SHA=check PROXY_ENV_FILE=/dev/null POSTGRES_ENV_FILE=/dev/null docker compose -f deploy/compose.yml config --quiet
      - name: Build API image
        run: docker build -t typesafe-proxy:check apps/api
      - name: Check nginx configuration
        run: bash deploy/check-nginx.sh

  production:
    # Use cases live in the API database (published by `npm run content:review`); this job
    # ships the API, then the web Worker that renders them, and checks both from outside.
    name: Publish API and web
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
      # The Worker's workers.dev URL until the typesafe.pro custom domain is moved from Pages.
      WEB_URL: ${{ vars.WEB_URL || 'https://typesafe-pro-web.chigwel137.workers.dev' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy and verify the API
        env:
          TYPESAFE_TEST_API_TOKEN_1: ${{ secrets.TYPESAFE_TEST_API_TOKEN_1 }}
          TYPESAFE_MASTER_API_TOKEN_1: ${{ secrets.TYPESAFE_MASTER_API_TOKEN_1 }}
          TYPESAFE_ADMIN_API_TOKEN_1: ${{ secrets.TYPESAFE_ADMIN_API_TOKEN_1 }}
          TYPESAFE_CONTENT_TOKEN_1: ${{ secrets.TYPESAFE_CONTENT_TOKEN_1 }}
          REDIS_URL: redis://redis:6379/0
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TOKEN_HASH_SECRET: ${{ secrets.TOKEN_HASH_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: bash deploy/ci.sh
      - name: Build the web Worker
        run: npm run build:web
      - name: Deploy the web Worker
        run: npm run deploy:web
      - name: Smoke-test the web Worker
        run: npm run smoke --workspace @typesafe-pro/web
      - name: Validate SEO on every published use case
        run: npm run validate:seo --workspace @typesafe-pro/web -- --all
