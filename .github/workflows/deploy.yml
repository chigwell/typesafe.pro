name: Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.ref || 'production' }}
  cancel-in-progress: false

jobs:
  check:
    name: Check API and web
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.18-bookworm
        env:
          POSTGRES_USER: typesafe
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: typesafe_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U typesafe -d typesafe_test" --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.2-bookworm
        ports: ["6379:6379"]
        options: --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://typesafe:test-only-password@127.0.0.1:5432/typesafe_test
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install uv
        run: python -m pip install uv==0.6.8
      - run: uv sync --project apps/api --frozen
      - run: uv sync --project tools/seo --frozen
      - run: uv run --project apps/api ruff check apps/api deploy
      - run: uv run --project apps/api ruff format --check apps/api deploy
      - run: uv run --project apps/api pytest apps/api/tests deploy/tests
      - run: uv run --project tools/seo ruff check tools/seo
      - run: uv run --project tools/seo ruff format --check tools/seo
      - run: uv run --project tools/seo pytest tools/seo/tests
      - run: uv run --project tools/seo python -m seo_content validate
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test --workspace @typesafe-pro/web
      - run: npm run build --workspace @typesafe-pro/web
      - name: Check deployment scripts
        run: |
          for script in deploy/*.sh; do bash -n "$script"; done
          shellcheck deploy/*.sh
          RELEASE_ID=check RELEASE_SHA=check PROXY_ENV_FILE=/dev/null POSTGRES_ENV_FILE=/dev/null docker compose -f deploy/compose.yml config --quiet
      - name: Build API image
        run: docker build -t typesafe-proxy:check apps/api
      - name: Check nginx configuration
        run: bash deploy/check-nginx.sh

  production:
    name: Publish API and verified content
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: write
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_USER: ${{ secrets.SSH_USER }}
      SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
      SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
      CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID || secrets.CLOUDFLARE_ACCOUNT_ID }}
      CF_API_TOKEN: ${{ secrets.CF_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Reuse content checkpoints and reject superseded source releases
        run: python3 deploy/content_release.py checkout-current
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install uv and content dependencies
        run: |
          python -m pip install uv==0.6.8
          uv sync --project tools/seo --frozen
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Deploy and verify
        id: api
        env:
          TYPESAFE_TEST_API_TOKEN_1: ${{ secrets.TYPESAFE_TEST_API_TOKEN_1 }}
          TYPESAFE_MASTER_API_TOKEN_1: ${{ secrets.TYPESAFE_MASTER_API_TOKEN_1 }}
          TYPESAFE_ADMIN_API_TOKEN_1: ${{ secrets.TYPESAFE_ADMIN_API_TOKEN_1 }}
          REDIS_URL: redis://redis:6379/0
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          TOKEN_HASH_SECRET: ${{ secrets.TOKEN_HASH_SECRET }}
          ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
        run: bash deploy/ci.sh
      - name: Reconcile the last successful publication
        run: python3 deploy/content_release.py baseline --output "$RUNNER_TEMP/seo-baseline.json"
      - name: Generate and verify up to five new use cases
        env:
          LLM7_BASE_URL: ${{ secrets.LLM7_BASE_URL }}
          LLM7_TOKEN: ${{ secrets.LLM7_TOKEN }}
          LLM7_MODEL: ${{ secrets.LLM7_MODEL }}
          TYPESAFE_ADMIN_API_TOKEN_1: ${{ secrets.TYPESAFE_ADMIN_API_TOKEN_1 }}
        run: >-
          uv run --frozen --project tools/seo python -m seo_content generate
          --run-id "$GITHUB_RUN_ID" --source-sha "$GITHUB_SHA"
          --baseline "$RUNNER_TEMP/seo-baseline.json"
          --report "$RUNNER_TEMP/seo-report.json"
      - name: Record generation result
        run: python3 deploy/content_release.py record --report "$RUNNER_TEMP/seo-report.json"
      - name: Build and validate the exact publication artifact
        run: |
          uv run --frozen --project tools/seo python -m seo_content validate
          npm run build:web
      - name: Preserve verified content in Git
        id: content
        run: python3 deploy/content_release.py persist
      - name: Ensure Pages project exists
        run: npm run cf:pages:ensure
      - name: Publish the validated artifact
        env:
          CONTENT_SHA: ${{ steps.content.outputs.content_sha }}
        run: |
          python3 deploy/content_release.py assert-current
          bash scripts/cf-env.sh wrangler pages deploy apps/web/out --project-name=typesafe-pro --branch=main --commit-hash="$CONTENT_SHA" --commit-dirty=false
      - name: Verify public pages and record publication
        run: >-
          python3 deploy/content_release.py verify
          --manifest content/use-cases/release.json
          --baseline "$RUNNER_TEMP/seo-baseline.json"
      - name: Record a failed publication attempt
        if: failure() && steps.api.outcome == 'success'
        run: python3 deploy/content_release.py record --report "$RUNNER_TEMP/seo-report.json" --failed
      - name: Keep the release report for recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seo-release-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/seo-report.json
            ${{ runner.temp }}/seo-baseline.json
            content/use-cases/release.json
          if-no-files-found: ignore
