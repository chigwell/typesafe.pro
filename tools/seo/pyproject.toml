[project]
name = "typesafe-seo-content"
version = "0.1.0"
description = "Verified, bounded TypeSafe use-case content generation"
requires-python = ">=3.12,<3.13"
dependencies = [
  "httpx==0.28.1",
  "llmatch-messages==2025.10.271723",
  "pydantic==2.11.4",
]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.16.8"]

[build-system]
requires = ["hatchling==1.29.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["seo_content"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Stage lambdas passed to ReviewSession.resilient() run immediately, inside the same loop turn.
"seo_content/review.py" = ["B023"]
