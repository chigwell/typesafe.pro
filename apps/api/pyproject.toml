[project]
name = "typesafe-proxy"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "alembic==1.16.5",
  "asyncpg==0.30.0",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "redis==6.4.0",
  "sqlalchemy[asyncio]==2.0.43",
  "uvicorn==0.53.0",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.8"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
