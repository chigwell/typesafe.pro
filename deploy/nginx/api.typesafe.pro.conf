log_format typesafe_safe '$time_iso8601 method=$request_method status=$status '
                         'duration=$request_time upstream=$upstream_status';

server {
    listen 80;
    listen [::]:80;
    server_name api.typesafe.pro;
    access_log /var/log/nginx/typesafe-access.log typesafe_safe;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://api.typesafe.pro$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.typesafe.pro;
    ssl_certificate /etc/letsencrypt/live/api.typesafe.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.typesafe.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/typesafe-access.log typesafe_safe;
    # nginx error messages can embed the full request URL, including its query string.
    error_log /dev/null;
    client_max_body_size 10m;
    client_body_timeout 60s;
    # Verified 2026-09-21 against https://www.cloudflare.com/ips-v4 and /ips-v6.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive off;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 125s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_next_upstream off;
        gzip off;
    }
}
