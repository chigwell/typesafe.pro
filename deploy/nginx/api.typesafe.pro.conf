log_format typesafe_safe '$time_iso8601 method=$request_method status=$status '
                         'duration=$request_time upstream=$upstream_status';

server {
    listen 80;
    listen [::]:80;
    server_name api.typesafe.pro;
    access_log /var/log/nginx/typesafe-access.log typesafe_safe;
    error_log /dev/null;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }
    location / {
        return 308 https://api.typesafe.pro$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.typesafe.pro;
    ssl_certificate /etc/letsencrypt/live/api.typesafe.pro/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.typesafe.pro/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/typesafe-access.log typesafe_safe;
    # nginx error messages can embed the full request URL, including its query string.
    error_log /dev/null;
    client_max_body_size 10m;
    client_body_timeout 60s;

    location / {
        proxy_pass http://127.0.0.1:8010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_send_timeout 75s;
        proxy_read_timeout 75s;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_intercept_errors off;
        proxy_redirect off;
        proxy_next_upstream off;
        gzip off;
    }
}
