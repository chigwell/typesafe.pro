services:
  api:
    image: typesafe-proxy:${RELEASE_ID:?RELEASE_ID required}
    build:
      context: ../apps/api
    container_name: typesafe-proxy-api
    restart: unless-stopped
    ports:
      - "127.0.0.1:8010:8000"
    env_file:
      - path: ${PROXY_ENV_FILE:?PROXY_ENV_FILE required}
        format: raw
    environment:
      RELEASE_SHA: ${RELEASE_SHA:?RELEASE_SHA required}
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    pids_limit: 128
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import json,os,urllib.request; d=json.load(urllib.request.urlopen('http://127.0.0.1:8000/health',timeout=3)); assert d['service']=='typesafe-proxy' and d['release']==os.environ['RELEASE_SHA']"]
      interval: 5s
      timeout: 4s
      retries: 10
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
